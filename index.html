<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무주군 치매안심가맹점 지도</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* 상단 버튼 */
        .top-controls {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 20;
        }

        .list-toggle {
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            background: #fff;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
        }

        /* 가맹점 목록 패널 */
        .store-panel {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 30;
            width: 360px;
            max-width: 90vw;
            height: 100%;
            background: #fff;
            box-shadow: 4px 0 14px rgba(0, 0, 0, 0.18);
            transform: translateX(-105%);
            transition: transform 0.22s ease;
            display: flex;
            flex-direction: column;
        }

        .store-panel.open {
            transform: translateX(0);
        }

        .panel-header {
            padding: 18px 16px 14px;
            border-bottom: 1px solid #e9e9e9;
            background: #fff;
        }

        .panel-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .panel-title {
            margin: 0;
            font-size: 19px;
            line-height: 1.3;
        }

        .panel-count {
            color: #666;
            font-size: 13px;
            white-space: nowrap;
        }

        .panel-close {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 50%;
            background: #f3f3f3;
            font-size: 20px;
            line-height: 34px;
            cursor: pointer;
        }

        .search-input {
            width: 100%;
            height: 42px;
            border: 1px solid #d7d7d7;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #777;
        }

        .store-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: #fff;
        }

        .store-item {
            padding: 14px 16px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
        }

        .store-item:hover {
            background: #f8f8f8;
        }

        .store-item-name {
            margin-bottom: 5px;
            font-size: 15px;
            font-weight: 700;
            color: #222;
        }

        .store-item-address {
            color: #666;
            font-size: 12px;
            line-height: 1.5;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .empty-message {
            padding: 28px 16px;
            color: #777;
            font-size: 14px;
            text-align: center;
        }

        /* 마커 팝업 */
        .info-window {
            width: 270px;
            box-sizing: border-box;
            padding: 12px 14px 16px;
            line-height: 1.45;
            font-size: 13px;
            overflow: hidden;
        }

        .info-window strong {
            display: block;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .info-window .address {
            margin-bottom: 12px;
            color: #555;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .info-window .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
        }

        .info-window .map-button {
            display: block;
            width: 100%;
            height: 34px;
            box-sizing: border-box;
            padding: 0 8px;
            border: 1px solid #d5d5d5;
            border-radius: 5px;
            background: #fff;
            color: #222;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            line-height: 32px;
            white-space: nowrap;
        }

        .info-window .map-button:hover {
            background: #f5f5f5;
        }

        @media (max-width: 700px) {
            .top-controls {
                top: 10px;
                left: 10px;
            }

            .list-toggle {
                padding: 9px 12px;
                font-size: 13px;
            }

            .store-panel {
                top: auto;
                bottom: 0;
                width: 100%;
                max-width: none;
                height: 72%;
                border-radius: 16px 16px 0 0;
                box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.18);
                transform: translateY(105%);
            }

            .store-panel.open {
                transform: translateY(0);
            }

            .panel-header {
                padding-top: 14px;
            }

            .info-window {
                width: 250px;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="map"></div>

        <div class="top-controls">
            <button id="listToggle" class="list-toggle" type="button">가맹점 목록</button>
        </div>

        <aside id="storePanel" class="store-panel" aria-hidden="true">
            <div class="panel-header">
                <div class="panel-title-row">
                    <div>
                        <h2 class="panel-title">치매안심가맹점</h2>
                        <div id="panelCount" class="panel-count"></div>
                    </div>
                    <button id="panelClose" class="panel-close" type="button" aria-label="목록 닫기">×</button>
                </div>

                <input
                    id="storeSearch"
                    class="search-input"
                    type="search"
                    placeholder="가맹점명을 검색하세요"
                    autocomplete="off"
                >
            </div>

            <div id="storeList" class="store-list"></div>
        </aside>
    </div>

    <!--
      IMPORTANT:
      아래 YOUR_KAKAO_JAVASCRIPT_KEY 부분을
      현재 사용 중인 본인의 카카오 JavaScript 키로 바꾸세요.
    -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bbb0ccfb76d663f66a13288f9d9f8ff5"></script>

    <script src="./stores.js"></script>

    <script>
        const container = document.getElementById('map');

        const options = {
            center: new kakao.maps.LatLng(36.0068, 127.6608),
            level: 9
        };

        const map = new kakao.maps.Map(container, options);

        const bounds = new kakao.maps.LatLngBounds();
        let openedInfoWindow = null;

        const storePanel = document.getElementById('storePanel');
        const listToggle = document.getElementById('listToggle');
        const panelClose = document.getElementById('panelClose');
        const storeSearch = document.getElementById('storeSearch');
        const storeList = document.getElementById('storeList');
        const panelCount = document.getElementById('panelCount');

        const storeMapItems = [];

        stores.forEach((store) => {
            const position = new kakao.maps.LatLng(store.lat, store.lng);

            const marker = new kakao.maps.Marker({
                position: position,
                map: map
            });

            const safeName = escapeHtml(store.name);
            const safeAddress = escapeHtml(store.address);

            // Kakao Map 공식 링크 형식
            const encodedName = encodeURIComponent(store.name);
            const mapUrl =
                `https://map.kakao.com/link/map/${encodedName},${store.lat},${store.lng}`;

            const routeUrl =
                `https://map.kakao.com/link/to/${encodedName},${store.lat},${store.lng}`;

            const infoWindow = new kakao.maps.InfoWindow({
                content: `
                    <div class="info-window">
                        <strong>${safeName}</strong>
                        <div class="address">${safeAddress}</div>

                        <div class="buttons">
                            <a
                                class="map-button"
                                href="${mapUrl}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                카카오맵에서 보기
                            </a>

                            <a
                                class="map-button"
                                href="${routeUrl}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                길찾기
                            </a>
                        </div>
                    </div>
                `
            });

            kakao.maps.event.addListener(marker, 'click', function () {
                openStore(store, marker, infoWindow);
            });

            storeMapItems.push({
                store: store,
                marker: marker,
                infoWindow: infoWindow
            });

            bounds.extend(position);
        });

        if (stores.length > 0) {
            map.setBounds(bounds);
        }

        renderStoreList(stores);

        listToggle.addEventListener('click', function () {
            openPanel();
        });

        panelClose.addEventListener('click', function () {
            closePanel();
        });

        storeSearch.addEventListener('input', function () {
            const keyword = storeSearch.value.trim().toLowerCase();

            const filtered = stores.filter((store) =>
                store.name.toLowerCase().includes(keyword)
            );

            renderStoreList(filtered);
        });

        function renderStoreList(list) {
            storeList.innerHTML = '';
            panelCount.textContent = `총 ${list.length}개`;

            if (list.length === 0) {
                storeList.innerHTML =
                    '<div class="empty-message">검색 결과가 없습니다.</div>';
                return;
            }

            list.forEach((store) => {
                const item = document.createElement('div');
                item.className = 'store-item';

                item.innerHTML = `
                    <div class="store-item-name">${escapeHtml(store.name)}</div>
                    <div class="store-item-address">${escapeHtml(store.address)}</div>
                `;

                item.addEventListener('click', function () {
                    const target = storeMapItems.find(
                        (entry) => entry.store === store
                    );

                    if (!target) return;

                    map.setLevel(4);
                    map.panTo(
                        new kakao.maps.LatLng(store.lat, store.lng)
                    );

                    setTimeout(function () {
                        openStore(
                            target.store,
                            target.marker,
                            target.infoWindow
                        );
                    }, 250);

                    if (window.innerWidth <= 700) {
                        closePanel();
                    }
                });

                storeList.appendChild(item);
            });
        }

        function openStore(store, marker, infoWindow) {
            if (openedInfoWindow) {
                openedInfoWindow.close();
            }

            infoWindow.open(map, marker);
            openedInfoWindow = infoWindow;
        }

        function openPanel() {
            storePanel.classList.add('open');
            storePanel.setAttribute('aria-hidden', 'false');
        }

        function closePanel() {
            storePanel.classList.remove('open');
            storePanel.setAttribute('aria-hidden', 'true');
        }

        // 지도 빈 곳을 클릭하면 열려 있는 팝업 닫기
        kakao.maps.event.addListener(map, 'click', function () {
            if (openedInfoWindow) {
                openedInfoWindow.close();
                openedInfoWindow = null;
            }
        });

        function escapeHtml(text) {
            return String(text)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }
    </script>
</body>
</html>
