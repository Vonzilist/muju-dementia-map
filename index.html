<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무주군 치매안심가맹점 지도</title>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        button, input { font: inherit; }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* ===== 지도 위 기본 UI ===== */
        .top-controls {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 20;
            display: flex;
            gap: 8px;
        }

        .list-toggle,
        .location-button {
            border: 1px solid #d8d8d8;
            border-radius: 9px;
            background: #fff;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,.16);
        }

        .location-button:disabled {
            cursor: wait;
            opacity: .65;
        }

        /* ===== 범례 ===== */
        .legend {
            position: absolute;
            right: 14px;
            bottom: 18px;
            z-index: 20;
            display: grid;
            grid-template-columns: repeat(2, auto);
            gap: 6px 10px;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background: rgba(255,255,255,.95);
            box-shadow: 0 2px 8px rgba(0,0,0,.13);
            font-size: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .legend-dot {
            width: 22px;
            height: 22px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 1px 3px rgba(0,0,0,.25);
            flex: 0 0 auto;
        }

        .legend-dot span {
            transform: rotate(45deg);
            font-size: 11px;
            font-weight: 700;
        }

        /* ===== 가맹점 목록 패널 ===== */
        .store-panel {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 30;
            width: 380px;
            max-width: 92vw;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #fff;
            box-shadow: 4px 0 14px rgba(0,0,0,.18);
            transform: translateX(-105%);
            transition: transform .22s ease;
        }

        .store-panel.open { transform: translateX(0); }

        .panel-header {
            padding: 17px 16px 13px;
            border-bottom: 1px solid #e9e9e9;
        }

        .panel-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .panel-title {
            margin: 0 0 3px;
            font-size: 19px;
            line-height: 1.3;
        }

        .panel-count {
            color: #666;
            font-size: 13px;
        }

        .panel-close {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 50%;
            background: #f3f3f3;
            font-size: 20px;
            cursor: pointer;
        }

        .search-input {
            width: 100%;
            height: 42px;
            border: 1px solid #d7d7d7;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus { border-color: #777; }

        .category-filters {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding: 11px 0 2px;
            scrollbar-width: thin;
        }

        .filter-button {
            flex: 0 0 auto;
            border: 1px solid #dcdcdc;
            border-radius: 999px;
            background: #fff;
            padding: 7px 10px;
            color: #444;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .filter-button.active {
            background: #222;
            border-color: #222;
            color: #fff;
        }

        .sort-controls {
            display: flex;
            align-items: center;
            gap: 7px;
            padding-top: 10px;
        }

        .sort-label {
            color: #666;
            font-size: 12px;
            font-weight: 700;
            margin-right: 2px;
        }

        .sort-button {
            border: 1px solid #dcdcdc;
            border-radius: 999px;
            background: #fff;
            padding: 6px 10px;
            color: #444;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .sort-button.active {
            background: #222;
            border-color: #222;
            color: #fff;
        }

        .sort-button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .store-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .store-item {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .store-item:hover { background: #f8f8f8; }

        .store-item-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .store-item-name {
            font-size: 15px;
            font-weight: 700;
            color: #222;
        }

        .category-badge {
            flex: 0 0 auto;
            border-radius: 999px;
            padding: 3px 7px;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
        }

        .store-item-address {
            color: #666;
            font-size: 12px;
            line-height: 1.5;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .store-item-distance {
            margin-top: 5px;
            color: #2F80ED;
            font-size: 12px;
            font-weight: 700;
        }

        .empty-message {
            padding: 30px 16px;
            color: #777;
            text-align: center;
            font-size: 14px;
        }

        /* ===== 팝업 ===== */
        .info-window {
            width: 275px;
            padding: 12px 14px 16px;
            line-height: 1.45;
            font-size: 13px;
            overflow: hidden;
        }

        .info-window .popup-top {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 5px;
        }

        .info-window strong {
            font-size: 15px;
        }

        .info-window .address {
            margin-bottom: 12px;
            color: #555;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .info-window .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
        }

        .info-window .map-button {
            display: block;
            width: 100%;
            height: 34px;
            padding: 0 8px;
            border: 1px solid #d5d5d5;
            border-radius: 5px;
            background: #fff;
            color: #222;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            line-height: 32px;
            white-space: nowrap;
        }

        .info-window .map-button:hover { background: #f5f5f5; }

        @media (max-width: 700px) {
            .top-controls {
                top: 10px;
                left: 10px;
            }

            .list-toggle,
            .location-button {
                padding: 9px 12px;
                font-size: 13px;
            }

            .store-panel {
                top: auto;
                bottom: 0;
                width: 100%;
                max-width: none;
                height: 74%;
                border-radius: 16px 16px 0 0;
                box-shadow: 0 -4px 16px rgba(0,0,0,.18);
                transform: translateY(105%);
            }

            .store-panel.open { transform: translateY(0); }

            .legend {
                right: 10px;
                bottom: 12px;
                grid-template-columns: repeat(3, auto);
                gap: 5px 8px;
                padding: 8px 9px;
                font-size: 10px;
            }

            .legend-dot {
                width: 19px;
                height: 19px;
            }

            .legend-dot span {
                font-size: 9px;
            }

            .info-window { width: 250px; }
        }
    </style>
</head>

<body>
<div id="app">
    <div id="map"></div>

    <div class="top-controls">
        <button id="listToggle" class="list-toggle" type="button">가맹점 목록</button>
        <button id="locationButton" class="location-button" type="button">내 위치</button>
    </div>

    <div id="legend" class="legend"></div>

    <aside id="storePanel" class="store-panel" aria-hidden="true">
        <div class="panel-header">
            <div class="panel-title-row">
                <div>
                    <h2 class="panel-title">치매안심가맹점</h2>
                    <div id="panelCount" class="panel-count"></div>
                </div>
                <button id="panelClose" class="panel-close" type="button" aria-label="목록 닫기">×</button>
            </div>

            <input
                id="storeSearch"
                class="search-input"
                type="search"
                placeholder="가맹점명을 검색하세요"
                autocomplete="off"
            >

            <div id="categoryFilters" class="category-filters"></div>

            <div class="sort-controls">
                <span class="sort-label">정렬</span>
                <button id="defaultSortButton" class="sort-button active" type="button">기본순</button>
                <button id="distanceSortButton" class="sort-button" type="button">가까운 순</button>
            </div>
        </div>

        <div id="storeList" class="store-list"></div>
    </aside>
</div>

<!-- 현재 사용 중인 카카오 JavaScript 키로 교체하세요. -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bbb0ccfb76d663f66a13288f9d9f8ff5"></script>

<!-- 업로드할 때 파일명을 stores.js 로 바꿔 사용하세요. -->
<script src="./stores.js"></script>

<script>
    const categoryOrder = ['카페', '음식점', '약국', '편의점', '의원', '기타'];

    const categoryStyle = {
        '카페':   { color: '#9B6B43', icon: 'C' },
        '음식점': { color: '#D95C45', icon: 'F' },
        '약국':   { color: '#2F8F5B', icon: '+' },
        '편의점': { color: '#3478C6', icon: 'M' },
        '의원':   { color: '#7A5CB8', icon: 'H' },
        '기타':   { color: '#6D737A', icon: '●' }
    };

    const container = document.getElementById('map');
    const options = {
        center: new kakao.maps.LatLng(36.0068, 127.6608),
        level: 9
    };

    const map = new kakao.maps.Map(container, options);

    const bounds = new kakao.maps.LatLngBounds();
    let openedInfoWindow = null;
    let activeCategory = '전체';
    let sortMode = 'default';

    const storePanel = document.getElementById('storePanel');
    const listToggle = document.getElementById('listToggle');
    const locationButton = document.getElementById('locationButton');
    const panelClose = document.getElementById('panelClose');
    const storeSearch = document.getElementById('storeSearch');
    const storeList = document.getElementById('storeList');
    const panelCount = document.getElementById('panelCount');
    const categoryFilters = document.getElementById('categoryFilters');
    const legend = document.getElementById('legend');
    const defaultSortButton = document.getElementById('defaultSortButton');
    const distanceSortButton = document.getElementById('distanceSortButton');

    const storeMapItems = [];

    let currentLocationOverlay = null;
    let currentLocationPosition = null;

    stores.forEach((store) => {
        const position = new kakao.maps.LatLng(store.lat, store.lng);
        const style = categoryStyle[store.category] || categoryStyle['기타'];

        const markerImage = createMarkerImage(style.color, style.icon);

        const marker = new kakao.maps.Marker({
            position: position,
            map: map,
            image: markerImage
        });

        const safeName = escapeHtml(store.name);
        const safeAddress = escapeHtml(store.address);
        const safeCategory = escapeHtml(store.category);

        const encodedName = encodeURIComponent(store.name);
        const mapUrl =
            `https://map.kakao.com/link/map/${encodedName},${store.lat},${store.lng}`;
        const routeUrl =
            `https://map.kakao.com/link/to/${encodedName},${store.lat},${store.lng}`;

        const infoWindow = new kakao.maps.InfoWindow({
            content: `
                <div class="info-window">
                    <div class="popup-top">
                        <strong>${safeName}</strong>
                        <span class="category-badge"
                              style="background:${style.color}">
                              ${safeCategory}
                        </span>
                    </div>

                    <div class="address">${safeAddress}</div>

                    <div class="buttons">
                        <a class="map-button"
                           href="${mapUrl}"
                           target="_blank"
                           rel="noopener noreferrer">
                           카카오맵에서 보기
                        </a>
                        <a class="map-button"
                           href="${routeUrl}"
                           target="_blank"
                           rel="noopener noreferrer">
                           길찾기
                        </a>
                    </div>
                </div>
            `
        });

        kakao.maps.event.addListener(marker, 'click', function () {
            openStore(marker, infoWindow);
        });

        storeMapItems.push({
            store,
            marker,
            infoWindow
        });

        bounds.extend(position);
    });

    if (stores.length > 0) {
        map.setBounds(bounds);
    }

    buildFilters();
    buildLegend();
    distanceSortButton.disabled = true;
    updateSortButtons();
    applyFilters();

    listToggle.addEventListener('click', openPanel);
    locationButton.addEventListener('click', moveToCurrentLocation);
    panelClose.addEventListener('click', closePanel);
    storeSearch.addEventListener('input', applyFilters);

    defaultSortButton.addEventListener('click', function () {
        sortMode = 'default';
        updateSortButtons();
        applyFilters();
    });

    distanceSortButton.addEventListener('click', function () {
        if (!currentLocationPosition) {
            alert('가까운 순 정렬을 사용하려면 먼저 "내 위치" 버튼을 눌러 현재 위치를 확인해 주세요.');
            return;
        }

        sortMode = 'distance';
        updateSortButtons();
        applyFilters();
    });

    kakao.maps.event.addListener(map, 'click', function () {
        closeInfoWindow();
    });

    function moveToCurrentLocation() {
        if (!navigator.geolocation) {
            alert('이 브라우저에서는 위치정보 기능을 사용할 수 없습니다.');
            return;
        }

        locationButton.disabled = true;
        locationButton.textContent = '위치 확인 중...';

        navigator.geolocation.getCurrentPosition(
            function (position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                currentLocationPosition = new kakao.maps.LatLng(lat, lng);

                if (currentLocationOverlay) {
                    currentLocationOverlay.setMap(null);
                }

                const content = `
                    <div style="
                        width:22px;
                        height:22px;
                        border-radius:50%;
                        background:#2F80ED;
                        border:4px solid #ffffff;
                        box-shadow:0 1px 6px rgba(0,0,0,.35);
                    " title="내 위치"></div>
                `;

                currentLocationOverlay = new kakao.maps.CustomOverlay({
                    position: currentLocationPosition,
                    content: content,
                    xAnchor: 0.5,
                    yAnchor: 0.5,
                    zIndex: 50
                });

                currentLocationOverlay.setMap(map);

                map.setLevel(4);
                map.panTo(currentLocationPosition);

                storeMapItems.forEach((entry) => {
                    entry.distanceMeters = calculateDistanceMeters(
                        lat,
                        lng,
                        entry.store.lat,
                        entry.store.lng
                    );
                });

                distanceSortButton.disabled = false;

                if (sortMode === 'distance') {
                    applyFilters();
                }

                locationButton.disabled = false;
                locationButton.textContent = '내 위치';
            },
            function (error) {
                locationButton.disabled = false;
                locationButton.textContent = '내 위치';

                let message = '현재 위치를 확인할 수 없습니다.';

                if (error.code === 1) {
                    message = '위치 권한이 거부되었습니다. 브라우저의 위치 권한을 허용한 뒤 다시 시도해 주세요.';
                } else if (error.code === 2) {
                    message = '현재 위치 정보를 가져올 수 없습니다.';
                } else if (error.code === 3) {
                    message = '위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.';
                }

                alert(message);
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 30000
            }
        );
    }

    function buildFilters() {
        const allButton = makeFilterButton('전체');
        categoryFilters.appendChild(allButton);

        categoryOrder.forEach((category) => {
            categoryFilters.appendChild(makeFilterButton(category));
        });
    }

    function makeFilterButton(category) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className =
            'filter-button' + (category === activeCategory ? ' active' : '');

        const count = category === '전체'
            ? stores.length
            : stores.filter((s) => s.category === category).length;

        button.textContent = `${category} ${count}`;

        button.addEventListener('click', function () {
            activeCategory = category;

            document.querySelectorAll('.filter-button').forEach((btn) => {
                btn.classList.remove('active');
            });

            button.classList.add('active');
            applyFilters();
        });

        return button;
    }

    function buildLegend() {
        legend.innerHTML = '';

        categoryOrder.forEach((category) => {
            const style = categoryStyle[category];

            const item = document.createElement('div');
            item.className = 'legend-item';

            item.innerHTML = `
                <span class="legend-dot"
                      style="background:${style.color}">
                    <span>${style.icon}</span>
                </span>
                <span>${escapeHtml(category)}</span>
            `;

            legend.appendChild(item);
        });
    }

    function applyFilters() {
        const keyword = storeSearch.value.trim().toLowerCase();

        let visibleEntries = storeMapItems.filter((entry) => {
            const categoryMatch =
                activeCategory === '전체' ||
                entry.store.category === activeCategory;

            const keywordMatch =
                entry.store.name.toLowerCase().includes(keyword);

            return categoryMatch && keywordMatch;
        });

        if (sortMode === 'distance' && currentLocationPosition) {
            visibleEntries = [...visibleEntries].sort((a, b) => {
                const aDistance = Number.isFinite(a.distanceMeters) ? a.distanceMeters : Infinity;
                const bDistance = Number.isFinite(b.distanceMeters) ? b.distanceMeters : Infinity;
                return aDistance - bDistance;
            });
        }

        const visibleSet = new Set(visibleEntries);

        storeMapItems.forEach((entry) => {
            entry.marker.setMap(visibleSet.has(entry) ? map : null);
        });

        renderStoreList(visibleEntries);
        panelCount.textContent = `현재 ${visibleEntries.length}개 / 전체 ${stores.length}개`;

        if (openedInfoWindow) {
            closeInfoWindow();
        }
    }

    function renderStoreList(entries) {
        storeList.innerHTML = '';

        if (entries.length === 0) {
            storeList.innerHTML =
                '<div class="empty-message">조건에 맞는 가맹점이 없습니다.</div>';
            return;
        }

        entries.forEach((entry) => {
            const { store } = entry;
            const style = categoryStyle[store.category] || categoryStyle['기타'];

            const item = document.createElement('div');
            item.className = 'store-item';

            item.innerHTML = `
                <div class="store-item-top">
                    <div class="store-item-name">${escapeHtml(store.name)}</div>
                    <span class="category-badge"
                          style="background:${style.color}">
                        ${escapeHtml(store.category)}
                    </span>
                </div>
                <div class="store-item-address">
                    ${escapeHtml(store.address)}
                </div>
                ${
                    Number.isFinite(entry.distanceMeters)
                        ? `<div class="store-item-distance">${formatDistance(entry.distanceMeters)}</div>`
                        : ''
                }
            `;

            item.addEventListener('click', function () {
                map.setLevel(4);
                map.panTo(
                    new kakao.maps.LatLng(store.lat, store.lng)
                );

                setTimeout(function () {
                    openStore(entry.marker, entry.infoWindow);
                }, 250);

                if (window.innerWidth <= 700) {
                    closePanel();
                }
            });

            storeList.appendChild(item);
        });
    }

    function createMarkerImage(color, icon) {
        const svg = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="42" height="48" viewBox="0 0 42 48">
                <path d="M21 1
                         C10.5 1 2 9.5 2 20
                         C2 32.5 21 47 21 47
                         C21 47 40 32.5 40 20
                         C40 9.5 31.5 1 21 1Z"
                      fill="${color}"
                      stroke="#ffffff"
                      stroke-width="2"/>
                <circle cx="21" cy="20" r="10.8"
                        fill="#ffffff" opacity="0.96"/>
                <text x="21" y="24"
                      text-anchor="middle"
                      font-family="Arial, sans-serif"
                      font-size="12"
                      font-weight="700"
                      fill="${color}">
                      ${icon}
                </text>
            </svg>
        `;

        const src =
            'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);

        const size = new kakao.maps.Size(42, 48);
        const options = {
            offset: new kakao.maps.Point(21, 47)
        };

        return new kakao.maps.MarkerImage(src, size, options);
    }

    function updateSortButtons() {
        defaultSortButton.classList.toggle('active', sortMode === 'default');
        distanceSortButton.classList.toggle('active', sortMode === 'distance');
    }

    function calculateDistanceMeters(lat1, lng1, lat2, lng2) {
        const earthRadius = 6371000;
        const toRadians = (degrees) => degrees * Math.PI / 180;

        const phi1 = toRadians(lat1);
        const phi2 = toRadians(lat2);
        const deltaPhi = toRadians(lat2 - lat1);
        const deltaLambda = toRadians(lng2 - lng1);

        const a =
            Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
            Math.cos(phi1) * Math.cos(phi2) *
            Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);

        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        return earthRadius * c;
    }

    function formatDistance(meters) {
        if (!Number.isFinite(meters)) return '';

        if (meters < 1000) {
            return `약 ${Math.max(10, Math.round(meters / 10) * 10)}m`;
        }

        return `약 ${(meters / 1000).toFixed(1)}km`;
    }

    function openStore(marker, infoWindow) {
        if (openedInfoWindow) {
            openedInfoWindow.close();
        }

        infoWindow.open(map, marker);
        openedInfoWindow = infoWindow;
    }

    function closeInfoWindow() {
        if (openedInfoWindow) {
            openedInfoWindow.close();
            openedInfoWindow = null;
        }
    }

    function openPanel() {
        storePanel.classList.add('open');
        storePanel.setAttribute('aria-hidden', 'false');
    }

    function closePanel() {
        storePanel.classList.remove('open');
        storePanel.setAttribute('aria-hidden', 'true');
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }
</script>
</body>
</html>
