<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무주군 치매안심가맹점 지도</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .info-window {
            width: 270px;
            box-sizing: border-box;
            padding: 12px 14px 16px;
            line-height: 1.45;
            font-size: 13px;
            overflow: hidden;
        }

        .info-window strong {
            display: block;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .info-window .address {
            margin-bottom: 12px;
            color: #555;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .info-window .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
        }

        .info-window .map-button {
            display: block;
            width: 100%;
            height: 34px;
            box-sizing: border-box;
            padding: 0 8px;
            border: 1px solid #d5d5d5;
            border-radius: 5px;
            background: #fff;
            color: #222;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            line-height: 32px;
            white-space: nowrap;
        }

        .info-window .map-button:hover {
            background: #f5f5f5;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!--
      IMPORTANT:
      아래 YOUR_KAKAO_JAVASCRIPT_KEY 부분을
      현재 사용 중인 본인의 카카오 JavaScript 키로 바꾸세요.
    -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bbb0ccfb76d663f66a13288f9d9f8ff5"></script>

    <script src="./stores.js"></script>

    <script>
        const container = document.getElementById('map');

        const options = {
            center: new kakao.maps.LatLng(36.0068, 127.6608),
            level: 9
        };

        const map = new kakao.maps.Map(container, options);

        const bounds = new kakao.maps.LatLngBounds();
        let openedInfoWindow = null;

        stores.forEach((store) => {
            const position = new kakao.maps.LatLng(store.lat, store.lng);

            const marker = new kakao.maps.Marker({
                position: position,
                map: map
            });

            const safeName = escapeHtml(store.name);
            const safeAddress = escapeHtml(store.address);

            // Kakao Map 공식 링크 형식
            const encodedName = encodeURIComponent(store.name);
            const mapUrl =
                `https://map.kakao.com/link/map/${encodedName},${store.lat},${store.lng}`;

            const routeUrl =
                `https://map.kakao.com/link/to/${encodedName},${store.lat},${store.lng}`;

            const infoWindow = new kakao.maps.InfoWindow({
                content: `
                    <div class="info-window">
                        <strong>${safeName}</strong>
                        <div class="address">${safeAddress}</div>

                        <div class="buttons">
                            <a
                                class="map-button"
                                href="${mapUrl}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                카카오맵에서 보기
                            </a>

                            <a
                                class="map-button"
                                href="${routeUrl}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                길찾기
                            </a>
                        </div>
                    </div>
                `
            });

            kakao.maps.event.addListener(marker, 'click', function () {
                if (openedInfoWindow) {
                    openedInfoWindow.close();
                }

                infoWindow.open(map, marker);
                openedInfoWindow = infoWindow;
            });

            bounds.extend(position);
        });

        if (stores.length > 0) {
            map.setBounds(bounds);
        }

        function escapeHtml(text) {
            return String(text)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }
    </script>
</body>
</html>
